name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4']
        laravel: ['12.*']
        livewire: ['4.3.*']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require laravel/framework:${{ matrix.laravel }} livewire/livewire:${{ matrix.livewire }} --no-interaction --no-update
      - run: composer install --prefer-dist --no-interaction
      - run: composer test
      - run: composer analyse
      - run: composer audit

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code dist/
      - run: npm test
      - run: npm run lint
      - run: npm audit
